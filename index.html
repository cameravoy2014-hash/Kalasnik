
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="BLACK PINES — Official horror game website">
  <title>BLACK PINES | Official</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 8%;
      border-bottom: 1px solid #292929;
    }

    .logo {
      color: #c71919;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    nav a {
      color: #ddd;
      text-decoration: none;
      margin-left: 22px;
      font-size: 14px;
    }

    nav a:hover {
      color: #e32626;
    }

    .hero {
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px 20px;
      background:
        radial-gradient(ellipse at center, #351010 0%, #111 42%, #080808 75%);
    }

    .tag {
      color: #df2929;
      letter-spacing: 5px;
      font-size: 12px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(48px, 10vw, 100px);
      font-weight: 900;
      letter-spacing: 8px;
      text-shadow: 0 0 35px #a00000;
    }

    .subtitle {
      color: #aaa;
      margin-top: 20px;
      font-size: 17px;
      letter-spacing: 2px;
    }

    .date {
      margin-top: 35px;
      color: #eee;
      border: 1px solid #8f1919;
      padding: 13px 24px;
      letter-spacing: 2px;
    }

    .about {
      max-width: 800px;
      margin: auto;
      padding: 75px 25px;
      text-align: center;
    }

    h2 {
      color: #d51f1f;
      letter-spacing: 4px;
      margin-bottom: 24px;
    }

    .about p {
      color: #aaa;
      line-height: 1.8;
    }

    footer {
      border-top: 1px solid #292929;
      padding: 25px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 18px;
      }

      nav a {
        margin: 0 8px;
      }

      h1 {
        letter-spacing: 3px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">BLACK PINES</div>
    <nav>
      <a href="#home">HOME</a>
      <a href="#about">ABOUT</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <p class="tag">SURVIVAL HORROR</p>
      <h1>BLACK PINES</h1>
      <p class="subtitle">THE FOREST NEVER FORGETS.</p>
      <div class="date">OFFICIAL RELEASE — NOVEMBER 1</div>
    </section>

    <section class="about" id="about">
      <h2>ABOUT THE GAME</h2>
      <p>
        Enter the darkness of Black Pines.
        Explore the unknown, uncover hidden secrets,
        and discover what waits beyond the trees.
      </p>
    </section>
  </main>

  <footer>
    BLACK PINES &copy; 2026 — Official Website
  </footer>
</body>
</html>
